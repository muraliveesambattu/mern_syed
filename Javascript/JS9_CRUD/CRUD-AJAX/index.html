<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <table border="" style="width: 100%;">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>State</th>
                <th>Zip</th>
                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        // Synchronous Means -- Starting 2nd Activity after Completing 1st Activity 
        // Asynchronos - Handling Both the the Activities at same time ..

        // Asynchronos
        // Javascript 
        // Aand 
        // XML
        var users = [];
        function getDataFromServer(){
           var getInfo = new XMLHttpRequest();
           getInfo.onreadystatechange = function (){
            if(getInfo.readyState === 4 & getInfo.status == 200){
                users = JSON.parse(getInfo.response);
                displayUsers()
            }
           }
           getInfo.open("GET","http://localhost:3000/users");
           getInfo.send()
        };

        getDataFromServer();

         function displayUsers() {
            document.querySelector("tbody").innerHTML = "";
            for (i = 0; i < users.length; i++) {
                var myTr = document.createElement('tr');
                var user = users[i];

                // The following loop is responsible to create each row
                for (a in user) {
                    var myTd = document.createElement("td")
                    myTd.innerHTML = user[a];
                    myTr.appendChild(myTd)
                }

                // 1. Add Delete Button to the tr 
                var deleteTd = document.createElement("td");
                var deleteBtn = document.createElement("button");
                deleteBtn.setAttribute("onclick", "handleDelete(" + i + ")")
                deleteBtn.innerHTML = "Delete";
                deleteTd.appendChild(deleteBtn)
                myTr.appendChild(deleteTd);

                // Create Edit Button 
                var editTd = document.createElement('td');
                var editBtn = document.createElement("button");
                editBtn.setAttribute("onclick", "handleEdit(" + i + ")")
                editBtn.innerHTML = "Edit"
                editTd.appendChild(editBtn)
                myTr.appendChild(editTd);
                document.querySelector('tbody').appendChild(myTr);
            }
        }

        function handleDelete(i){
            console.log(users[i])
            var deleteUser = new XMLHttpRequest();
            deleteUser.onreadystatechange = function(){
                if(deleteUser.readyState ==4 && deleteUser.status == 200){
                    getDataFromServer()
                }
            }
            deleteUser.open("DELETE","http://localhost:3000/users/"+users[i].id);
            deleteUser.send()
        }
    </script>
</body>
</html>
