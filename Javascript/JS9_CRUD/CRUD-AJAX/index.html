<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form {
            display: none;
        }

        #createBtn {
            display: none;
        }
    </style>
</head>

<body>
    <button onclick="showCreateUser()">Create User</button>
    <table border="" style="width: 100%;">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>ID</th>
                <th>Email</th>
                <th>State</th>
                <th>Zip</th>


                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <br>
    <form>
        <label for="">First Name : </label>
        <input type="text" name="" id="fname"> <br>
        <label for="">Last Name : </label>
        <input type="text" name="" id="lname"> <br>
        <label for="">Email : </label>
        <input type="text" name="" id="email"> <br>
        <label for="">State : </label>
        <input type="text" name="" id="state"> <br>
        <label for="">Zip : </label>
        <input type="text" name="" id="zip"> <br>
        <input type="text" name="" id="id" hidden>
        <button onclick="updateUser()" type="button" id="updateBtn">Update User</button>
        <button onclick="createUser()" type="button" id="createBtn">Create User</button>
    </form>
    <script>
        // Synchronous Means -- Starting 2nd Activity after Completing 1st Activity 
        // Asynchronos - Handling Both the the Activities at same time ..

        // Asynchronos
        // Javascript 
        // Aand 
        // XML
        var users = [];
        function getDataFromServer() {
            var getInfo = new XMLHttpRequest();
            getInfo.onreadystatechange = function () {
                if (getInfo.readyState === 4 & getInfo.status == 200) {
                    users = JSON.parse(getInfo.response);
                    displayUsers()
                }
            }
            getInfo.open("GET", "http://localhost:3000/users");
            getInfo.send()
        };

        getDataFromServer();

        function displayUsers() {
            document.querySelector("tbody").innerHTML = "";
            for (i = 0; i < users.length; i++) {
                var myTr = document.createElement('tr');
                var user = users[i];

                myTr.innerHTML = `  <td>${users[i].fname}</td>
                                    <td>${users[i].lname}</td>
                                    <td>${users[i].id}</td>
                                    <td>${users[i].email}</td>
                                    <td>${users[i].state}</td>
                                    <td>${users[i].zip}</td>
                                   `
                // The following loop is responsible to create each row
                // for (a in user) {
                //     var myTd = document.createElement("td")
                //     myTd.innerHTML = user[a];
                //     myTr.appendChild(myTd)
                // }

                // 1. Add Delete Button to the tr 
                var deleteTd = document.createElement("td");
                var deleteBtn = document.createElement("button");
                deleteBtn.setAttribute("onclick", "handleDelete(" + i + ")")
                deleteBtn.innerHTML = "Delete";
                deleteTd.appendChild(deleteBtn)
                myTr.appendChild(deleteTd);

                // Create Edit Button 
                var editTd = document.createElement('td');
                var editBtn = document.createElement("button");
                editBtn.setAttribute("onclick", "handleEdit(" + i + ")")
                editBtn.innerHTML = "Edit"
                editTd.appendChild(editBtn)
                myTr.appendChild(editTd);
                document.querySelector('tbody').appendChild(myTr);
            }
        }

        function handleDelete(i) {
            console.log(users[i])
            var deleteUser = new XMLHttpRequest();
            deleteUser.onreadystatechange = function () {
                if (deleteUser.readyState == 4 && deleteUser.status == 200) {
                    getDataFromServer()
                }
            }
            deleteUser.open("DELETE", "http://localhost:3000/users/" + users[i].id);
            deleteUser.send()
        }

        function handleEdit(i) {
            document.querySelector('form').style.display = "block";
            document.getElementById("createBtn").style.display = "none";
            document.getElementById("updateBtn").style.display = "block";

            console.log(users[i]);
            document.getElementById("fname").value = users[i].fname
            document.getElementById("lname").value = users[i].lname
            document.getElementById("email").value = users[i].email
            document.getElementById("state").value = users[i].state
            document.getElementById("zip").value = users[i].zip
            document.getElementById("id").value = users[i].id
        }

        function updateUser() {
            var updatedUser = {
                fname: document.getElementById("fname").value,
                lname: document.getElementById("lname").value,
                email: document.getElementById("email").value,
                state: document.getElementById("state").value,
                zip: document.getElementById("zip").value,
                id: document.getElementById("id").value
            }

            var updateInfo = new XMLHttpRequest();
            updateInfo.onreadystatechange = function () {
                if (updateInfo.readyState == 4 && updateInfo.status == 200) {
                    console.log("User Updated !!!");
                }
            }
            updateInfo.open("PUT", "http://localhost:3000/users/" + updatedUser.id);
            updateInfo.setRequestHeader("Content-Type", "Application/json");
            updateInfo.send(JSON.stringify(updatedUser))
        }

        function showCreateUser() {
            document.querySelector('form').style.display = "block"
            document.getElementById('createBtn').style.display = "block"
            document.getElementById('updateBtn').style.display = "none"
            resetForm()
        }

        function createUser() {
            var newUser = {
                fname: document.getElementById("fname").value,
                lname: document.getElementById("lname").value,
                email: document.getElementById("email").value,
                state: document.getElementById("state").value,
                zip: document.getElementById("zip").value,
            }
            var newUserInfo = new XMLHttpRequest();
            newUserInfo.onreadystatechange = function () {
                if (newUserInfo.readyState == 4 && newUserInfo.status == 200) {
                    console.log("User Updated !!!");
                }
            }
            newUserInfo.open("POST", "http://localhost:3000/users/");
            newUserInfo.setRequestHeader("Content-Type", "Application/json");
            newUserInfo.send(JSON.stringify(newUser))
        }
        function resetForm() {
            document.getElementById("fname").value = "";
            document.getElementById("lname").value = "";
            document.getElementById("email").value = "";
            document.getElementById("state").value = "";
            document.getElementById("zip").value = "";
            document.getElementById("id").value = "";


        }
    </script>
</body>

</html>
