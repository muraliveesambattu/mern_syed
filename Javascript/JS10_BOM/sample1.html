<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    form {
      max-width: 450px;
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .inline-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .inline-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }
    button {
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>User Registration Form</h2>

  <form>
    <!-- User ID -->
    <div class="field" hidden>
      <label for="userid">User ID</label>
      <input type="text" id="userid" name="userid" placeholder="Enter User ID" required disabled/>
    </div>

    <!-- First Name -->
    <div class="field">
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="fname" placeholder="Enter First Name" required />
    </div>

    <!-- Last Name -->
    <div class="field">
      <label for="lname">Password</label>
      <input type="password" id="password" name="lname" placeholder="Enter Last Name" required />
    </div>

    <!-- Email -->
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter Email" required />
    </div>

    <!-- State Dropdown -->
    <div class="field">
      <label for="state">State</label>
      <select id="state" name="state" required>
        <option value="">-- Select State --</option>
        <option value="TN">Tamil Nadu</option>
        <option value="KA">Karnataka</option>
        <option value="AP">Andhra Pradesh</option>
        <option value="TS">Telangana</option>
        <option value="KL">Kerala</option>
      </select>
    </div>

    <!-- Gender Radio -->
    <div class="field">
      <label>Gender</label>
      <div class="inline-group">
        <label><input type="radio" name="gender" value="Male" required /> Male</label>
        <label><input type="radio" name="gender" value="Female" /> Female</label>
        <label><input type="radio" name="gender" value="Other" /> Other</label>
      </div>
    </div>

    <!-- Subject Checkbox -->
    <div class="field">
      <label>Subject</label>
      <div class="inline-group">
        <label><input type="checkbox" name="subject" value="Java" /> Java</label>
        <label><input type="checkbox" name="subject" value="Python" /> Python</label>
        <label><input type="checkbox" name="subject" value="JavaScript" /> JavaScript</label>
      </div>
    </div>

    <!-- DOB Date -->
    <div class="field">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required />
    </div>

    <!-- Login Time -->
    <div class="field">
      <label for="login">Login Time</label>
      <input type="time" id="login" name="login" required />
    </div>

    <button type="button" onclick="createUser()">Submit</button>
    <button type="reset">Reset</button>
  </form>
<script src="bom.js"></script>
</body>
</html>
