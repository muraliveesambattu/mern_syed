<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .success {
            color: white;
            background: green;
        }
    </style>
</head>

<body>
    <h2>Welcome to DOM Topic </h2>
    <ul>

    </ul>
    <script>

        // 1. Change the HTML Content 
        // document.querySelector("h2").innerHTML = "New Content Added !!!"

        // 2. Change CSS property 
        // document.querySelector("h2").style.color = "red"
        // document.querySelector("h2").style.background = "grey"
        // document.querySelector("h2").style.fontSize="42px"

        // 3. Adding Attributes 
        document.querySelector("h2").setAttribute("onclick", "handleColorChange()")
        function handleColorChange() {
            document.querySelector("h2").style.color = "red"
        }

        // 4. Add Or Remove Elements 

        var userInput = prompt("How many List Items you want to Add ?");
        console.log(userInput)
        for (i = 0; i < userInput; i++) {
            var listItem = document.createElement("li");
            listItem.innerHTML = "Item " + i;
            document.querySelector("ul").appendChild(listItem)
        }

        var allListItems = document.querySelectorAll("li");
        for (i = 0; i < allListItems.length; i++) {
            allListItems[i].setAttribute("class", "success")
            allListItems[i].style.margin = '2px'
            allListItems[i].addEventListener("click", function () {
                console.log(this)
                this.remove()
            })
        }

    </script>
</body>

</html>
