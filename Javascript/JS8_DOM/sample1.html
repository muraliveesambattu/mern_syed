<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Welcome to DOM Topic</h1>
    <p>Hello I am Para</p>
    <img src="./autumn-fall-nature-scene-autumnal-park-beautiful-77869343.webp" alt="">
    <script>
        document
            .querySelector("h1")
            .style
            .color = "green";

        document.querySelector("img").onmouseover = function () {
            document.querySelector("img").style.border = "5px solid red"
        }
        document.querySelector("img").onmouseout = function () {
            document.querySelector("img").style.border = ""

        }
    </script>
</body>

</html>
